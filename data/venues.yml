# OpenAlex source name (regex, first match wins) -> venue id.
# Used only for recent papers DBLP has not indexed yet.
openalex_venues:
  'Theory of Information Retrieval|ICTIR': ictir
  'SIGIR Forum': sigirforum
  'SIGIR': sigir
  'Information and Knowledge Management|CIKM': cikm
  'Web Search and Data Mining|WSDM': wsdm
  'World Wide Web|WWW|Web Conference': www
  'European Conference on Information Retrieval|ECIR': ecir
  'Recommender Systems|RecSys': recsys
  'Knowledge Discovery and Data Mining|KDD': kdd
  'Transactions on Information Systems': tois
  'Transactions on Knowledge and Data Engineering': tkde
  'Information Processing (&|and) Management': ipm
  'Transactions on the Web': tweb
  'Transactions on Intelligent Systems': tist
  'Transactions on Recommender Systems': tors
  'Online Social Networks and Media': osnm
  'Information Systems$': is
  'Future Generation Computer Systems': fgcs
  'Expert Systems with Applications': eswa
  'Applied Computing|SAC': sac
  'Web and Social Media|ICWSM': icwsm

# Order of publications within a year (most relevant first).
# type_order: tiers by type; "a+b" puts two types in the same tier.
type_order: [a_conf+q1, conf+journal, workshop, book+edited, other, preprint]

# Within a tier, these venues come first, in this order (badge names as shown
# on the site); unlisted venues follow alphabetically.
venue_priority:
  - SIGIR
  - TOIS
  - KDD
  - WWW
  - WSDM
  - TKDE
  - CIKM
  - ICDE
  - PVLDB
  - ECIR
