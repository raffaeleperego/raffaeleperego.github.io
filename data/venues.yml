# Venue classification for scripts/build_publications.py.
#
# The DBLP key carries the venue id: DBLP:conf/sigir/Foo15 -> "sigir",
# DBLP:journals/tois/Foo20 -> "tois". The lists below use those ids.
#
#   inproceedings at a venue in a_conferences      -> "A/A* conferences"
#   inproceedings whose booktitle says "workshop"   -> "Workshops"
#     (or contains "@", or venue in workshop_venues)
#   article in a journal listed in q1_journals     -> "Q1 journals"
#   CoRR / arXiv                                   -> "Preprints"
#   @proceedings                                   -> "Edited volumes"
#
# a_conferences follows CORE 2023 (A* and A); q1_journals follows Scimago
# Q1 in a Computer Science category. Both are hand-maintained: edit freely.

a_conferences:
  # IR, Web, data mining, databases
  - sigir
  - kdd
  - www
  - cikm
  - wsdm
  - ecir
  - recsys
  - icde
  - vldb
  - pvldb
  - sigmod
  - edbt
  - icdm
  - sdm
  - gis          # ACM SIGSPATIAL
  - er
  - ijcai
  - aaai
  - nips
  - icml
  - iclr
  - acl
  - emnlp
  - naacl
  - mm           # ACM Multimedia
  - icwsm
  # Parallel and distributed computing
  - ipps         # IPDPS
  - europar
  - hpdc
  - ics
  - sc
  - ccgrid
  - icdcs
  - ppopp

q1_journals:
  - tois
  - tkde
  - ipm
  - tweb
  - tist
  - tkdd
  - tpds
  - jpdc
  - isci
  - eswa
  - is            # Information Systems
  - osnm
  - fgcs
  - jnca
  - tits
  - cgf
  - datamine
  - vldb          # VLDB Journal
  - tecs
  - tevc
  - kbs
  - csur
  - tors

# Venues whose papers are workshop papers even when the booktitle does
# not say so (national workshops and satellite events).
workshop_venues:
  - iir
  - sebd
  - lsds-ir
  - hpcn

# Regex (case-insensitive) on the title: entries that are not papers.
skip_title_patterns:
  - '^editorial\b'
  - '^guest editorial\b'
  - '^preface\b'
  - '^foreword\b'
  - '^message from\b'
  - "chairs'?\\s+welcome"
  - '^report on\b'
  - '^session details\b'

